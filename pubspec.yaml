name: flow_math
description: Flow Math — calm math practice, a cozy focus timer and breathing.
publish_to: 'none'
# version: <name>+<versionCode>. Bump the number after + for every Play upload.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  audioplayers: ^5.2.1
  flutter_local_notifications: ^17.2.2  # streak + focus reminders
  timezone: ^0.9.4                  # required by notifications

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/app_icons/