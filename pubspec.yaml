name: flow_math
description: Flow State Math — Anti-Scroll Focus App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  audioplayers: ^5.2.1
  shared_preferences: ^2.2.2
  purchases_flutter: ^8.0.0        # RevenueCat — subscriptions
  flutter_local_notifications: ^17.2.2  # streak + focus reminders
  timezone: ^0.9.4                  # required by notifications
  change_app_package_name: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/audio/