org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Run Kotlin compilation inside the Gradle daemon instead of a separate
# daemon process, so less memory is taken away from the Dart compiler.
kotlin.compiler.execution.strategy=in-process
